# Hosted dependency resolution requires an explicitly approved PyPI EAI.
# Application project: source is shipped explicitly, not built as a wheel.
[project]
name = "employee-roster"
requires-python = "~=3.11.0"
version = "0.1.0"
description = "Owner-rights Streamlit employee roster"
dependencies = [
    "streamlit[snowflake]>=1.66,<2",
    "snowflake-connector-python",
    "snowflake-snowpark-python",
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "regex",
]

[dependency-groups]
dev = ["pytest>=8,<10", "PyYAML>=6,<7", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py311"
line-length = 110
